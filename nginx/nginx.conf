events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # React Router — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html must always be revalidated — it references the current
        # build's content-hashed asset filenames, and each deploy replaces
        # those assets entirely rather than keeping old ones around. A
        # browser-cached index.html left over from a previous deploy will
        # point at API config baked into a JS bundle that no longer matches
        # the live backend.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Hashed assets are immutable — safe to cache aggressively.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
