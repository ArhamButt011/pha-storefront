events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream storefront_app {
        server app:3000;
    }

    server {
        listen 80;

        # Fingerprinted JS/CSS — content-hashed filenames, safe to cache
        # forever; never needs to reach Node.
        location /assets/ {
            root /usr/share/nginx/html/client;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Everything else copied from public/ (logo, favicon, etc.) — not
        # fingerprinted, so a short cache instead of immutable.
        location /branding/ {
            root /usr/share/nginx/html/client;
            expires 1h;
        }

        # Every route (SSR'd or client-rendered) — including 404s, since
        # the loader-thrown 404 Response needs to reach the browser with
        # its real status intact, not get remapped to a static asset.
        location / {
            proxy_pass http://storefront_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # VERIFICATION FINDING: with nginx's defaults (60s), killing the
            # `app` container made every request hang for ~14s before nginx
            # even returned a 502 (confirmed with a real killed container,
            # not theoretical — the OS-level TCP connect attempt to the now-
            # dead upstream IP has to time out first). Short, explicit
            # timeouts make a real outage fail fast instead of hanging.
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
